<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Спасибо | Little English Star School</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #E8F4FD 0%, #FFF0F5 50%, #FFF9E6 100%);
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.1);
            max-width: 560px;
            width: 100%;
            text-align: center;
            padding: 50px 40px;
        }
        .logo {
            width: 120px;
            margin-bottom: 24px;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .check {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #4A90D9, #2E6BC6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: pop 0.5s ease;
        }
        @keyframes pop {
            0% { transform: scale(0); }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .check svg { width: 36px; height: 36px; }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #2D3436;
            margin-bottom: 12px;
        }
        h1 span { color: #F5418D; }
        p {
            font-size: 1.05rem;
            color: #555;
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .sub {
            font-size: 0.9rem;
            color: #999;
            margin-top: 8px;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 36px;
            background: #2E6BC6;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46,107,198,0.3);
        }
        .btn:hover {
            background: #1E4A8A;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46,107,198,0.4);
        }
        .whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 12px 28px;
            background: #25D366;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .whatsapp:hover {
            background: #1ea952;
            transform: translateY(-2px);
        }
        .divider {
            color: #ccc;
            font-size: 0.85rem;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="../littleenglishstar-logo.png" alt="Little English Star School" class="logo">
        <div class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1><span>Спасибо!</span></h1>
        <p>Мы получили ваше сообщение и скоро с вами свяжемся.</p>
        <p class="sub">Обычно мы отвечаем в течение 24 часов. Если вам нужен немедленный ответ, свяжитесь с нами в WhatsApp.</p>
        <a href="/ru/" class="btn">На главную &#10132;</a>

</body>
</html>
